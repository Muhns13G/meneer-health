name: Bug report
description: Report a reproducible product or repository defect using synthetic evidence.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include patient information, credentials, private configuration, or production logs.
        Report suspected vulnerabilities privately through SECURITY.md instead of this public form.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Public route or navigation
        - Campaign redirect
        - Accessibility or responsive layout
        - Test, build, or CI
        - Cloudflare preview or runtime
        - Documentation or governance
        - Other
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Observed outcome
      description: Describe what happened and why it is a defect.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide minimal steps, route, viewport, and safe fixture values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Branch and commit
      placeholder: itws-I at abc1234
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation already performed
      description: List commands, browsers, logs, screenshots, or other safe evidence.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: This report contains no patient information, credential, secret, or private source document.
          required: true
        - label: I reviewed SECURITY.md and this is not a vulnerability report.
          required: true
