name: Encrypted recovery export

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: Export source used for this controlled run
        required: true
        type: choice
        default: synthetic
        options:
          - synthetic
          - production

permissions:
  contents: read

concurrency:
  group: production-recovery-export
  cancel-in-progress: false

jobs:
  export:
    name: Encrypt, store, and signal recovery success
    if: github.event_name == 'workflow_dispatch' || vars.RECOVERY_EXPORT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RECOVERY_EXPORT_SOURCE: ${{ github.event_name == 'schedule' && 'production' || inputs.source }}
      RECOVERY_R2_BUCKET: ${{ vars.RECOVERY_R2_BUCKET }}
      RECOVERY_ENCRYPTION_KEY_BASE64: ${{ secrets.RECOVERY_ENCRYPTION_KEY_BASE64 }}
      BACKUP_HEARTBEAT_URL: ${{ secrets.BACKUP_HEARTBEAT_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify hosted recovery tooling
        run: |
          aws --version
          docker --version

      - name: Create and verify encrypted off-site recovery export
        run: bun run recovery:hosted
