name: CI

on:
  push:
    branches:
      - main
      - develop
      - itws-I
      - itws-I-preview
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Run unit and integration tests
        run: bun run test

      - name: Start synthetic local database and identity services
        run: bun run db:start:test

      - name: Validate database and managed identity security
        run: |
          bun run db:reset
          bun run db:test
          bun run db:lint
          bun run test:auth
          bun run test:authz

      - name: Stop synthetic local database and identity services
        if: always()
        run: bun run db:stop

      - name: Audit all dependencies
        run: bun run audit

      - name: Audit production dependencies
        run: bun run audit:prod

      - name: Build production bundle
        run: bun run build

      - name: Check generated route tree
        run: bun run check:generated

      - name: Validate Cloudflare upload
        run: bun run deploy:dry-run

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        run: bun run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: browser-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
